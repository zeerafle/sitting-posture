stages:
    # download:
    #   cmd: kaggle datasets download -d zeerafle/sitting-posture -p data/original --unzip
    #   outs:
    #   - data/original:
    #       persist: true
    #       cache: false
  extract_keypoints:
    cmd: uv run python src/extract_keypoints.py
    deps:
    - /teamspace/studios/01-data-download-kaggle/.cache/kagglehub/datasets/zeerafle/sitting-posture/versions/6
    - src/extract_keypoints.py
    outs:
    - data/data.csv:
        persist: true
    - data/poses_images_out:
        persist: true

  featurize:
    cmd: uv run python src/featurize.py
    deps:
    - data/data.csv
    - src/feature_extraction/
    - src/featurize.py
    outs:
    - data/data_with_features.csv:
        persist: true

  prepare_combined:
    cmd: uv run python src/prepare.py --combined
    deps:
    - data/data_with_features.csv
    - src/prepare.py
    - src/data_preparation/saver.py
    outs:
    - data/processed/all_all_features/combined/train.csv
    - data/processed/all_all_features/combined/test.csv

  train_combined:
    foreach:
    - adaboost
    - nn
    - xgb
    do:
      cmd: uv run python src/models/${item}/train.py --combined --data-config
        all_all_features
      deps:
      - src/models/${item}/train.py
      - data/processed/all_all_features/combined
      - src/models/evaluate.py
      - src/models/base_trainer.py
      params:
      - params.yaml:
      outs:
      - models/${item}/${item}_combined_all_all_features.joblib
      metrics:
      - dvclive/${item}/combined/metrics.json
      - dvclive/${item}/combined/htcv_results.json
      - dvclive/${item}/combined/cv_results.json

  train_loso_combined:
    foreach:
    - adaboost
    - nn
    - xgb
    do:
      cmd: uv run python src/models/${item}/train.py --combined --loso
      deps:
      - src/models/${item}/train.py
      - data/processed/all_all_features/combined/data.csv
      - src/models/evaluate.py
      - src/models/utils.py
      - src/models/base_trainer.py
      params:
      - params.yaml:
      outs:
      - models/${item}/${item}_combined_loso.joblib
      metrics:
      - dvclive/${item}/combined_loso/metrics.json
      - dvclive/${item}/combined_loso/loso_metrics.json

  train_cnn_loso:
    cmd: uv run python src/models/cnn/train_loso.py
    deps:
    - src/models/cnn/train_loso.py
    - /teamspace/studios/01-data-download-kaggle/.cache/kagglehub/datasets/zeerafle/sitting-posture/versions/6
    - data/data.csv
    outs:
    - models/cnn/cnn_combined_loso.keras
    metrics:
    - dvclive/cnn/combined_loso/metrics.json:
        cache: false
    - dvclive/cnn/combined_loso/loso_metrics.json:
        cache: false

  summarize_combined:
    cmd: uv run python src/model_comparison.py --combined
    deps:
    - src/model_comparison.py
    - dvclive/adaboost/combined/metrics.json
    - dvclive/nn/combined/metrics.json
    - dvclive/xgb/combined/metrics.json
    outs:
    - dvclive/detailed_model_view_combined_comparison.csv

  visualize_combined:
    cmd: uv run python src/roc_visualization.py --combined
    deps:
    - src/roc_visualization.py
    - dvclive/adaboost/combined/y_pred.csv
    - dvclive/nn/combined/y_pred.csv
    - dvclive/xgb/combined/y_pred.csv
    outs:
    - dvclive/plots/roc_curve_combined_comparison.png

  # Compact statistical analysis for combined view CV
  analyze_stats_combined:
    foreach: [accuracy, f1]
    do:
      cmd: uv run python src/analysis/statistical_test.py --models adaboost nn
        xgb --metric ${item} --combined --force_pairwise --bayesian
      deps:
      - src/analysis/statistical_test.py
      - src/analysis/statistical/
      - dvclive/adaboost/combined/cv_results.json
      - dvclive/nn/combined/cv_results.json
      - dvclive/xgb/combined/cv_results.json
      outs:
      - dvclive/analysis/friedman_combined_adaboost_nn_xgb_${item}.json

  # Compact statistical analysis for LOSO (subjects) on combined views
  analyze_stats_loso:
    foreach: [accuracy, f1]
    do:
      cmd: uv run python src/analysis/statistical_test.py --models adaboost nn
        xgb --metric ${item} --loso --force_pairwise --bayesian
      deps:
      - src/analysis/statistical_test.py
      - src/analysis/statistical/
      - dvclive/adaboost/combined_loso/loso_metrics.json
      - dvclive/nn/combined_loso/loso_metrics.json
      - dvclive/xgb/combined_loso/loso_metrics.json
      outs:
      # - dvclive/analysis/friedman_loso_adaboost_nn_xgb_${item}.json
      - dvclive/analysis/friedman_bayesian_loso_adaboost_nn_xgb_${item}.json

  # Ablation: data modes (real, synthetic, all) — simpler foreach by metric
  analyze_ablation_data_modes:
    foreach: [accuracy, f1]
    do:
      cmd: uv run python src/analysis/statistical_test.py --models
        real_keypoints_only synthetic_keypoints_only all_keypoints_only --metric
        ${item} --ablation --force_pairwise --bayesian --force-real-test
      deps:
      - src/analysis/statistical_test.py
      - src/analysis/statistical/
      - dvclive/xgb/combined_full_real_keypoints_only_loso/loso_metrics.json
      - dvclive/xgb/combined_full_synthetic_keypoints_only_loso/loso_metrics.json
      - dvclive/xgb/combined_full_all_keypoints_only_loso/loso_metrics.json
      outs:
      - dvclive/analysis/friedman_ablation_real_keypoints_only_synthetic_keypoints_only_all_keypoints_only_${item}.json

  # Ablation: features (keypoints_only vs all_features) — simpler foreach by metric
  analyze_ablation_features:
    foreach: [accuracy, f1]
    do:
      cmd: uv run python src/analysis/statistical_test.py --models
        all_keypoints_only all_all_features --metric ${item} --ablation
        --force_pairwise --bayesian --force-real-test
      deps:
      - src/analysis/statistical_test.py
      - src/analysis/statistical/
      - dvclive/xgb/combined_full_all_keypoints_only_loso/loso_metrics.json
      - dvclive/xgb/combined_full_all_all_features_loso/loso_metrics.json
      outs:
      - dvclive/analysis/friedman_ablation_all_keypoints_only_all_all_features_${item}.json

  # Ablation: full set of configurations — simpler foreach by metric
  analyze_ablation_full:
    foreach: [accuracy, f1]
    do:
      cmd: uv run python src/analysis/statistical_test.py --models
        real_keypoints_only real_all_features synthetic_keypoints_only
        synthetic_all_features all_keypoints_only all_all_features --metric
        ${item} --ablation --force_pairwise --bayesian --force-real-test
      deps:
      - src/analysis/statistical_test.py
      - src/analysis/statistical/
      - dvclive/xgb/combined_full_real_keypoints_only_loso/loso_metrics.json
      - dvclive/xgb/combined_full_real_all_features_loso/loso_metrics.json
      - dvclive/xgb/combined_full_synthetic_keypoints_only_loso/loso_metrics.json
      - dvclive/xgb/combined_full_synthetic_all_features_loso/loso_metrics.json
      - dvclive/xgb/combined_full_all_keypoints_only_loso/loso_metrics.json
      - dvclive/xgb/combined_full_all_all_features_loso/loso_metrics.json
      outs:
      - dvclive/analysis/friedman_ablation_real_keypoints_only_real_all_features_synthetic_keypoints_only_synthetic_all_features_all_keypoints_only_all_all_features_${item}.json

  # Prepare data for the ablation study with matrix
  prepare_ablation_combined:
    matrix:
      data_mode: [real, synthetic, all]
      feature_mode: [keypoints_only, all_features]
    cmd: uv run python src/prepare.py --loso --combined --data-mode
      ${item.data_mode} --feature-mode ${item.feature_mode}
    deps:
    - data/data_with_features.csv
    - src/prepare.py
    - src/data_preparation/data_filter.py
    outs:
    - data/processed/${item.data_mode}_${item.feature_mode}/combined_full/data.csv

  # Train the ablation models with matrix
  train_ablation_combined:
    matrix:
      data_mode: [real, synthetic, all]
      feature_mode: [keypoints_only, all_features]
    cmd: uv run python src/models/xgb/train.py --loso --combined --data-config
      ${item.data_mode}_${item.feature_mode}
    deps:
    - src/models/xgb/train.py
    - data/processed/${item.data_mode}_${item.feature_mode}/combined_full/data.csv
    - src/models/base_trainer.py
    - src/models/loso_workflow.py
    - src/models/utils.py
    - src/models/training_workflow.py
    params:
    - params.yaml:
    outs:
    - models/xgb/xgb_combined_full_${item.data_mode}_${item.feature_mode}.joblib
    metrics:
    - dvclive/xgb/combined_full_${item.data_mode}_${item.feature_mode}_loso/loso_metrics.json:
        cache: false

  # Analyze ablation results
  analyze_ablation:
    vars:
    - model: xgb
    cmd: uv run python src/run_ablation.py --combined --model ${model}
    deps:
    - src/run_ablation.py
    - dvclive/${model}/combined_full_real_keypoints_only_loso/loso_metrics.json
    - dvclive/${model}/combined_full_real_all_features_loso/loso_metrics.json
    - dvclive/${model}/combined_full_synthetic_keypoints_only_loso/loso_metrics.json
    - dvclive/${model}/combined_full_synthetic_all_features_loso/loso_metrics.json
    - dvclive/${model}/combined_full_all_keypoints_only_loso/loso_metrics.json
    - dvclive/${model}/combined_full_all_all_features_loso/loso_metrics.json
    outs:
    - dvclive/analysis/ablation:
        persist: true
        cache: false
