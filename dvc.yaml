stages:
  # Extract keypoints from images (unchanged)
  extract_keypoints:
    cmd: uv run python src/extract_keypoints.py
    deps:
    - /teamspace/studios/01-data-download-kaggle/.cache/kagglehub/datasets/zeerafle/sitting-posture/versions/6
    - src/extract_keypoints.py
    outs:
    - data/data.csv:
        persist: true
    - data/poses_images_out:
        persist: true

  # Extract features from keypoints (unchanged)
  featurize:
    cmd: uv run python src/featurize.py
    deps:
    - data/data.csv
    - src/feature_extraction/
    - src/featurize.py
    outs:
    - data/data_with_features.csv:
        persist: true

  # Prepare data for standard train-test split (combined data only)
  prepare_standard_split:
    cmd: uv run python src/prepare_standard.py
    deps:
    - data/data_with_features.csv
    - src/prepare_standard.py
    - src/data_preparation/
    outs:
    - data/processed/standard_split/train.csv
    - data/processed/standard_split/test.csv
    - data/processed/standard_split/preprocessors.joblib

  # Prepare data for LOSO (grouped 5-fold CV)
  prepare_loso:
    cmd: uv run python src/prepare_loso.py
    deps:
    - data/data_with_features.csv
    - src/prepare_loso.py
    - src/data_preparation/
    outs:
    - data/processed/loso/data.csv
    - data/processed/loso/preprocessors.joblib

  # Train models with standard train-test split (including hyperparameter tuning)
  train_standard_split:
    foreach:
    - adaboost
    - nn
    - xgb
    - cnn
    do:
      cmd: uv run python src/models/${item}/train_standard.py
      deps:
      - src/models/${item}/train_standard.py
      - src/models/base_trainer.py
      - src/models/standard_workflow.py
      - src/models/evaluate.py
      - src/models/utils.py
      - data/processed/standard_split/
      params:
      - params.yaml:${item}
      - params.yaml:random_state
      - params.yaml:n_iter
      - params.yaml:cv
      - params.yaml:scoring
      outs:
      - models/${item}/${item}_standard.joblib
      metrics:
      - dvclive/${item}/standard/metrics.json
      - dvclive/${item}/standard/hyperparameter_results.json
      - dvclive/${item}/standard/test_predictions.csv

  # Train models with LOSO (grouped 5-fold CV by participant)
  train_loso:
    foreach:
    - adaboost
    - nn
    - xgb
    - cnn
    do:
      cmd: uv run python src/models/${item}/train_loso.py
      deps:
      - src/models/${item}/train_loso.py
      - src/models/base_trainer.py
      - src/models/loso_workflow.py
      - src/models/evaluate.py
      - src/models/utils.py
      - data/processed/loso/
      params:
      - params.yaml:${item}
      - params.yaml:random_state
      - params.yaml:cv_folds
      outs:
      - models/${item}/${item}_loso.joblib
      metrics:
      - dvclive/${item}/loso/fold_metrics.json
      - dvclive/${item}/loso/aggregated_metrics.json

  # Statistical analysis of LOSO results to determine best model
  statistical_analysis_loso:
    foreach: [accuracy, f1]
    do:
      cmd: uv run python src/analysis/statistical_analysis.py --models adaboost nn xgb cnn --metric ${item} --analysis-type loso --output-dir dvclive/analysis/loso
      deps:
      - src/analysis/statistical_analysis.py
      - src/analysis/statistical/
      - dvclive/adaboost/loso/fold_metrics.json
      - dvclive/nn/loso/fold_metrics.json
      - dvclive/xgb/loso/fold_metrics.json
      - dvclive/cnn/loso/fold_metrics.json
      outs:
      - dvclive/analysis/loso/statistical_results_${item}.json
      - dvclive/analysis/loso/critical_difference_diagram_${item}.png
      - dvclive/analysis/loso/model_rankings_${item}.csv

  # Determine best model from statistical analysis
  select_best_model:
    cmd: uv run python src/analysis/select_best_model.py --metric accuracy --analysis-dir dvclive/analysis/loso
    deps:
    - src/analysis/select_best_model.py
    - dvclive/analysis/loso/statistical_results_accuracy.json
    - dvclive/analysis/loso/model_rankings_accuracy.csv
    outs:
    - dvclive/analysis/best_model.json

  # Prepare data for ablation experiments
  prepare_ablation:
    matrix:
      data_mode: [real, synthetic, all]
      feature_mode: [keypoints_only, all_features]
    cmd: uv run python src/prepare_ablation.py --data-mode ${item.data_mode} --feature-mode ${item.feature_mode}
    deps:
    - data/data_with_features.csv
    - src/prepare_ablation.py
    - src/data_preparation/
    outs:
    - data/processed/ablation/${item.data_mode}_${item.feature_mode}/data.csv
    - data/processed/ablation/${item.data_mode}_${item.feature_mode}/preprocessors.joblib

  # Train ablation models using best model (grouped 5-fold CV)
  train_ablation:
    matrix:
      data_mode: [real, synthetic, all]
      feature_mode: [keypoints_only, all_features]
    cmd: uv run python src/models/train_ablation.py --data-mode ${item.data_mode} --feature-mode ${item.feature_mode} --best-model-config dvclive/analysis/best_model.json
    deps:
    - src/models/train_ablation.py
    - src/models/base_trainer.py
    - src/models/loso_workflow.py
    - src/models/evaluate.py
    - src/models/utils.py
    - data/processed/ablation/${item.data_mode}_${item.feature_mode}/
    - dvclive/analysis/best_model.json
    params:
    - params.yaml:random_state
    - params.yaml:cv_folds
    outs:
    - models/ablation/best_model_${item.data_mode}_${item.feature_mode}.joblib
    metrics:
    - dvclive/ablation/${item.data_mode}_${item.feature_mode}/fold_metrics.json
    - dvclive/ablation/${item.data_mode}_${item.feature_mode}/aggregated_metrics.json

  # Statistical analysis of ablation experiment results
  statistical_analysis_ablation_data_modes:
    foreach: [accuracy, f1]
    do:
      cmd: uv run python src/analysis/statistical_analysis.py --models real_keypoints_only synthetic_keypoints_only all_keypoints_only --metric ${item} --analysis-type ablation --experiment-type data_modes --output-dir dvclive/analysis/ablation/data_modes
      deps:
      - src/analysis/statistical_analysis.py
      - src/analysis/statistical/
      - dvclive/ablation/real_keypoints_only/fold_metrics.json
      - dvclive/ablation/synthetic_keypoints_only/fold_metrics.json
      - dvclive/ablation/all_keypoints_only/fold_metrics.json
      outs:
      - dvclive/analysis/ablation/data_modes/statistical_results_${item}.json
      - dvclive/analysis/ablation/data_modes/critical_difference_diagram_${item}.png
      - dvclive/analysis/ablation/data_modes/model_rankings_${item}.csv

  statistical_analysis_ablation_feature_modes:
    foreach: [accuracy, f1]
    do:
      cmd: uv run python src/analysis/statistical_analysis.py --models all_keypoints_only all_all_features --metric ${item} --analysis-type ablation --experiment-type feature_modes --output-dir dvclive/analysis/ablation/feature_modes
      deps:
      - src/analysis/statistical_analysis.py
      - src/analysis/statistical/
      - dvclive/ablation/all_keypoints_only/fold_metrics.json
      - dvclive/ablation/all_all_features/fold_metrics.json
      outs:
      - dvclive/analysis/ablation/feature_modes/statistical_results_${item}.json
      - dvclive/analysis/ablation/feature_modes/critical_difference_diagram_${item}.png
      - dvclive/analysis/ablation/feature_modes/model_rankings_${item}.csv

  statistical_analysis_ablation_full:
    foreach: [accuracy, f1]
    do:
      cmd: uv run python src/analysis/statistical_analysis.py --models real_keypoints_only real_all_features synthetic_keypoints_only synthetic_all_features all_keypoints_only all_all_features --metric ${item} --analysis-type ablation --experiment-type full --output-dir dvclive/analysis/ablation/full
      deps:
      - src/analysis/statistical_analysis.py
      - src/analysis/statistical/
      - dvclive/ablation/real_keypoints_only/fold_metrics.json
      - dvclive/ablation/real_all_features/fold_metrics.json
      - dvclive/ablation/synthetic_keypoints_only/fold_metrics.json
      - dvclive/ablation/synthetic_all_features/fold_metrics.json
      - dvclive/ablation/all_keypoints_only/fold_metrics.json
      - dvclive/ablation/all_all_features/fold_metrics.json
      outs:
      - dvclive/analysis/ablation/full/statistical_results_${item}.json
      - dvclive/analysis/ablation/full/critical_difference_diagram_${item}.png
      - dvclive/analysis/ablation/full/model_rankings_${item}.csv

  # Generate comprehensive analysis report
  generate_analysis_report:
    cmd: uv run python src/analysis/generate_report.py --output-dir dvclive/analysis/final_report
    deps:
    - src/analysis/generate_report.py
    - dvclive/analysis/loso/
    - dvclive/analysis/ablation/
    - dvclive/analysis/best_model.json
    outs:
    - dvclive/analysis/final_report/comprehensive_analysis_report.html
    - dvclive/analysis/final_report/summary_statistics.csv

params:
- params.yaml:random_state
- params.yaml:n_iter
- params.yaml:cv
- params.yaml:cv_folds
- params.yaml:scoring
- params.yaml:adaboost
- params.yaml:nn
- params.yaml:xgb

metrics:
- dvclive/adaboost/standard/metrics.json
- dvclive/nn/standard/metrics.json
- dvclive/xgb/standard/metrics.json
- dvclive/cnn/standard/metrics.json
- dvclive/adaboost/loso/aggregated_metrics.json
- dvclive/nn/loso/aggregated_metrics.json
- dvclive/xgb/loso/aggregated_metrics.json
- dvclive/cnn/loso/aggregated_metrics.json
- dvclive/ablation/real_keypoints_only/aggregated_metrics.json
- dvclive/ablation/real_all_features/aggregated_metrics.json
- dvclive/ablation/synthetic_keypoints_only/aggregated_metrics.json
- dvclive/ablation/synthetic_all_features/aggregated_metrics.json
- dvclive/ablation/all_keypoints_only/aggregated_metrics.json
- dvclive/ablation/all_all_features/aggregated_metrics.json
